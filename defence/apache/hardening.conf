# /etc/apache2/conf-available/siwang-hardening.conf
#
# Global hardening for the Siwang lab box.
#
# Two jobs:
#   1. Ordinary hygiene (no version banners, no TRACE).
#   2. Guaranteeing that the response to an unmatched Host header is
#      BYTE-STABLE. Stage 1's fallback discovery path is
#          ffuf -H "Host: FUZZ.siwang.pineapple" ... -fs <brochure-size>
#      which only works if every bogus vhost returns an identical body.
#      Anything that varies per-request (a version banner, a server-generated
#      footer, a directory listing) would break that.
#
# Enable with:  a2enconf siwang-hardening

# No version / OS in Server: header or in generated error pages.
ServerTokens Prod
ServerSignature Off

# TRACE is never needed and is a free finding for a student running nikto.
TraceEnable Off

# Do not rewrite self-referential URLs using the client-supplied Host.
# Without this, a vhost can echo the fuzzed hostname back into redirects,
# which makes the response length vary with the length of the fuzz word
# and quietly destroys the -fs filter.
UseCanonicalName Off

# ETags embed inode + mtime; drop them so responses are identical across
# a rebuild or a rsync of the docroot.
FileETag None

<IfModule mod_headers.c>
    Header unset ETag
    Header always unset X-Powered-By
</IfModule>

# Never serve the contents of a directory. Every file a student is meant to
# reach is linked from somewhere; nothing is meant to be browsed.
<Directory /var/www/>
    Options -Indexes -Includes -ExecCGI +FollowSymLinks
    AllowOverride None
</Directory>
