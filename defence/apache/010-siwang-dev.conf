# /etc/apache2/sites-available/010-siwang-dev.conf
#
# STAGING PORTAL  --  dev.siwang.pineapple  --  /var/www/dev
#
# This is the vulnerable application. It must NOT resolve in public DNS --
# students reach it by adding an /etc/hosts entry (see install/hosts-entries.txt).
#
# The application itself only needs .php executed. The deliberate
# misconfiguration is the per-directory block further down, which additionally
# maps IMAGE extensions to PHP-FPM *inside the uploads directory only* -- that
# is what turns a valid-image-with-embedded-PHP upload into code execution.
#
# NOTE: for any of this to run, the FPM pool must also list these extensions in
# security.limit_extensions (see apache/php-fpm-siwang-dev.conf) -- FPM refuses
# to execute a script whose extension is not on that list, no matter how Apache
# routes it.
#
# Enable with:  a2ensite 010-siwang-dev

<VirtualHost *:80>
    ServerName dev.siwang.pineapple

    DocumentRoot /var/www/dev
    DirectoryIndex index.php index.html

    <Directory /var/www/dev>
        Options -Indexes -Includes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The application's own pages. Only .php -- nothing else needs executing at
    # the docroot level.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm-siwang-dev.sock|fcgi://localhost"
    </FilesMatch>

    # --- INTENTIONALLY VULNERABLE -------------------------------------------
    # Inside the upload directory ONLY, image extensions are handed to PHP-FPM.
    # Combined with an upload filter that lets a valid image carry a "<?=" tag,
    # this is the Stage 3 RCE. Scoped to this directory so images elsewhere are
    # never executed. Removing this block (or the matching security.limit_
    # extensions entry in the pool) closes Stage 3.
    <Directory /var/www/dev/uploads>
        <FilesMatch "\.(jpe?g|gif|png|bmp)$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm-siwang-dev.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>
    # ------------------------------------------------------------------------

    # Application internals are require_once'd from disk, never fetched over
    # HTTP. Denying them stops students reading config.php as source if the
    # FPM socket is ever down (a real way labs leak DB credentials early).
    <Directory /var/www/dev/includes>
        Require all denied
    </Directory>
    <Directory /var/www/dev/partials>
        Require all denied
    </Directory>

    # Rabbit hole #4. The stale "TODO: purge /backup-old/ before go-live"
    # comment in the page footer points here. The directory exists so the
    # 403 is honest, and it is empty so there is nothing behind it.
    <Directory /var/www/dev/backup-old>
        Require all denied
    </Directory>

    <FilesMatch "(^\.|~$|\.(bak|old|orig|save|swp|swo|inc|sql|log|dist|example)$)">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/siwang-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/siwang-dev-access.log combined
</VirtualHost>
