# /etc/apache2/sites-available/010-siwang-dev.conf
#
# STAGING PORTAL  --  dev.siwang.pineapple  --  /var/www/dev
#
# This is the vulnerable application. It must NOT resolve in public DNS --
# students reach it by adding an /etc/hosts entry (see install/hosts-entries.txt).
#
# The deliberate misconfiguration lives in the SetHandler block below: the
# PHP-FPM handler is bound to .phtml / .php5 / .php7 / .phar as well as .php,
# and it applies everywhere under the docroot INCLUDING /uploads. That is what
# turns the Stage 3 upload-filter bypass into code execution.
#
# Enable with:  a2ensite 010-siwang-dev

<VirtualHost *:80>
    ServerName dev.siwang.pineapple

    DocumentRoot /var/www/dev
    DirectoryIndex index.php index.html

    <Directory /var/www/dev>
        Options -Indexes -Includes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- INTENTIONALLY VULNERABLE -------------------------------------------
    # A .php-only blacklist in upload.php, paired with a handler that executes
    # four other extensions. Removing the extra extensions here closes Stage 3.
    <FilesMatch "\.(php|phtml|php5|php7|phar)$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm-siwang-dev.sock|fcgi://localhost"
    </FilesMatch>
    # ------------------------------------------------------------------------

    # Application internals are require_once'd from disk, never fetched over
    # HTTP. Denying them stops students reading config.php as source if the
    # FPM socket is ever down (a real way labs leak DB credentials early).
    <Directory /var/www/dev/includes>
        Require all denied
    </Directory>
    <Directory /var/www/dev/partials>
        Require all denied
    </Directory>

    # Rabbit hole #4. The stale "TODO: purge /backup-old/ before go-live"
    # comment in the page footer points here. The directory exists so the
    # 403 is honest, and it is empty so there is nothing behind it.
    <Directory /var/www/dev/backup-old>
        Require all denied
    </Directory>

    <FilesMatch "(^\.|~$|\.(bak|old|orig|save|swp|swo|inc|sql|log|dist|example)$)">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/siwang-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/siwang-dev-access.log combined
</VirtualHost>
