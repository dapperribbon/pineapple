; /etc/php/8.3/fpm/pool.d/siwang-dev.conf
;
; Dedicated PHP-FPM pool for dev.siwang.pineapple.
;
; A separate pool (rather than the default www pool) is what lets us scope
; open_basedir to this one application without affecting anything else, and
; gives the dev vhost its own socket so the other two vhosts genuinely have
; no route to a PHP interpreter.

[siwang-dev]

user  = www-data
group = www-data

listen       = /run/php/php8.3-fpm-siwang-dev.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests      = 500

; --- INTENTIONALLY PERMISSIVE -----------------------------------------------
; The lab REQUIRES command execution: it is the whole point of Stage 3.
; An empty disable_functions leaves system/exec/shell_exec/passthru/proc_open
; available. Do not "fix" this.
php_admin_value[disable_functions] =
; ----------------------------------------------------------------------------

; Loosely scoped to the webroot, per the lab brief.
;
; Note for the walkthrough: open_basedir is a PHP-level check only. It stops a
; webshell from read()ing /etc/passwd through PHP's own file functions, but a
; process spawned via system() is a child of php-fpm and inherits none of it --
; so a reverse shell escapes this completely. That is intended, and it is the
; pivot the deferred privesc stages rely on.
;
; The session and upload directories MUST be listed here. If they are not,
; session_start() and move_uploaded_file() fail with an open_basedir warning
; and the entire app breaks in a way that looks like a bug rather than a lab.
php_admin_value[open_basedir]      = /var/www/dev/:/tmp/:/var/tmp/:/var/lib/php/siwang-dev-sessions/

php_admin_value[session.save_path] = /var/lib/php/siwang-dev-sessions
php_admin_value[upload_tmp_dir]    = /tmp

php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size]       = 4M
php_admin_value[max_file_uploads]    = 5

; No stack traces or SQL errors leaked to the browser: the app is meant to be
; genuinely well-behaved everywhere except the two planted flaws, and a leaked
; PDO exception would hand students a free unintended path.
php_admin_flag[display_errors]        = off
php_admin_flag[display_startup_errors]= off
php_admin_flag[log_errors]            = on
php_admin_value[error_log]            = /var/log/php-siwang-dev.log

php_admin_flag[expose_php]        = off
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1

; --- INTENTIONALLY PERMISSIVE -----------------------------------------------
; FPM refuses to execute a script whose extension is not on this list, no
; matter how Apache routes the request. The default is ".php" only -- which is
; why image extensions (and, in the previous design, .phtml) would otherwise be
; silently refused. Listing the image extensions here is what lets the scoped
; uploads-directory handler in the vhost actually run an uploaded image as PHP.
;
; This is pool-global, but only the <Directory /var/www/dev/uploads> handler in
; the vhost routes images to FPM, so execution stays confined to that dir.
; Do not "fix" this by trimming it back to .php -- that closes Stage 3.
security.limit_extensions = .php .jpg .jpeg .gif .png .bmp
