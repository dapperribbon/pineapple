# /etc/apache2/sites-available/020-siwang-backup.conf
#
# BACKUP HOST  --  backup.siwang.pineapple  --  /var/www/backup
#
# STATUS: deliberate stub for the initial-access build (Stages 1-3).
#
# This vhost exists so that vhost fuzzing finds a second internal name and the
# box feels like a real estate rather than a single hidden app. Right now it
# serves one bland holding page and contains nothing of value -- it is NOT part
# of the Stage 1-3 path and is not hinted at anywhere in the brochure.
#
# It is the reserved hook for the deferred www-data -> user privilege
# escalation stage (see docs/PRIVESC-TODO.md). When that phase lands, its
# content goes in /var/www/backup and this file should not need to change.
#
# Like the brochure: no PHP handler, no server-side code.
#
# Enable with:  a2ensite 020-siwang-backup

<VirtualHost *:80>
    ServerName backup.siwang.pineapple

    DocumentRoot /var/www/backup
    DirectoryIndex index.html

    <Directory /var/www/backup>
        Options -Indexes -Includes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "\.(ph(p[0-9]?|tml|ar|ps|t)|cgi|pl|py|rb|sh)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "(^\.|~$|\.(bak|old|orig|save|swp|swo|inc|sql|log|dist|example)$)">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/siwang-backup-error.log
    CustomLog ${APACHE_LOG_DIR}/siwang-backup-access.log combined
</VirtualHost>

# ===========================================================================
#  Port 443 -- backup is HTTP-only too (see the dev vhost for the full why).
#  Claim the hostname on 443 and bounce it to http:// so an https:// attempt is
#  not silently served the default :443 vhost (the brochure).
# ===========================================================================
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName backup.siwang.pineapple

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/siwang.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/siwang.duckdns.org/privkey.pem

    RewriteEngine On
    RewriteRule ^ http://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/siwang-backup-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/siwang-backup-ssl-access.log combined
</VirtualHost>
</IfModule>
