# /etc/apache2/sites-available/000-siwang-main.conf
#
# PUBLIC BROCHURE  --  siwang.duckdns.org  --  /var/www/main
#
# This vhost is genuinely clean. There is no server-side code in this docroot
# at all: no PHP handler is attached, and PHP-ish extensions are explicitly
# denied. Nothing here is meant to be exploitable.
#
# It is ALSO the default vhost. Apache treats the first vhost it loads for a
# given address as the fallback for any unmatched Host header, and
# sites-enabled/ is read in filename order -- hence the 000- prefix. Keep it
# lexically first or Stage 1's ffuf fallback breaks.
#
# TLS: the public domain is served over HTTPS using an existing Let's Encrypt
# certificate for siwang.duckdns.org. The internal *.siwang.pineapple vhosts
# stay on plain HTTP -- they are not in public DNS and cannot hold a valid
# certificate, and students reach them over http:// by design.
#
# Enable with:  a2ensite 000-siwang-main   (needs: a2enmod ssl rewrite)

# ===========================================================================
#  Port 80
#
#  Three behaviours, in order:
#    1. A bare IP or empty Host -> redirect to the canonical HTTPS domain.
#       (This is the "typing the IP into a browser" case the lab wants caught.)
#    2. The canonical domain over HTTP -> upgrade to HTTPS.
#    3. ANYTHING ELSE (an unmatched *.siwang.pineapple fuzz word) -> fall
#       through and serve the brochure at a stable size, so the Stage 1 ffuf
#       vhost-discovery path keeps working. Do NOT add a blanket redirect here.
# ===========================================================================
<VirtualHost *:80>
    ServerName  siwang.duckdns.org
    ServerAlias www.siwang.duckdns.org

    DocumentRoot /var/www/main
    DirectoryIndex index.html

    RewriteEngine On

    # (0) Never redirect ACME challenges -- certbot's HTTP-01 renewal must be
    #     answerable over plain HTTP even though everything else upgrades.
    RewriteRule ^/?\.well-known/acme-challenge/ - [L]

    # (1) Host is a literal IPv4/IPv6 address, or absent. Note this keys on the
    #     Host HEADER, not the connection: `ffuf -H "Host: FUZZ.siwang.pineapple"`
    #     sends a hostname in the header even though it connects to the IP, so
    #     fuzzing is unaffected and only a real "http://<ip>/" visit is caught.
    RewriteCond %{HTTP_HOST} ^$ [OR]
    RewriteCond %{HTTP_HOST} ^[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?$ [OR]
    RewriteCond %{HTTP_HOST} ^\[?[0-9a-f]*:[0-9a-f:]+\]?(:[0-9]+)?$
    RewriteRule ^ https://siwang.duckdns.org%{REQUEST_URI} [R=301,L]

    # (2) Canonical domain (and www.) over HTTP -> HTTPS.
    RewriteCond %{HTTP_HOST} ^(www\.)?siwang\.duckdns\.org$ [NC]
    RewriteRule ^ https://siwang.duckdns.org%{REQUEST_URI} [R=301,L]

    # (3) Everything else falls through to the brochure below.

    <Directory /var/www/main>
        Options -Indexes -Includes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "\.(ph(p[0-9]?|tml|ar|ps|t)|cgi|pl|py|rb|sh)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "(^\.|~$|\.(bak|old|orig|save|swp|swo|inc|sql|log|dist|example)$)">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/siwang-main-error.log
    CustomLog ${APACHE_LOG_DIR}/siwang-main-access.log combined
</VirtualHost>

# ===========================================================================
#  Port 443 -- the brochure over TLS.
#
#  Certificate paths assume the standard certbot layout. If yours differs, edit
#  the three SSLCertificate* lines (install.sh also honours a CERT_DIR override).
#  mod_ssl provides sensible protocol/cipher defaults via /etc/apache2/mods-
#  available/ssl.conf, so we do not re-specify them here.
# ===========================================================================
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName  siwang.duckdns.org
    ServerAlias www.siwang.duckdns.org

    DocumentRoot /var/www/main
    DirectoryIndex index.html

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/siwang.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/siwang.duckdns.org/privkey.pem

    <Directory /var/www/main>
        Options -Indexes -Includes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "\.(ph(p[0-9]?|tml|ar|ps|t)|cgi|pl|py|rb|sh)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "(^\.|~$|\.(bak|old|orig|save|swp|swo|inc|sql|log|dist|example)$)">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/siwang-main-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/siwang-main-ssl-access.log combined
</VirtualHost>
</IfModule>
