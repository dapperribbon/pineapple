<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>siwang-backup</title>
<style>
  body {
    margin: 0;
    background: #f6f6f4;
    color: #33383d;
    font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: grid;
    place-items: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border: 1px solid #dcdcd8;
    padding: 2rem 2.4rem;
    max-width: 34rem;
  }
  h1 { margin: 0 0 0.8rem; font-size: 1.05rem; letter-spacing: 0.02em; }
  p  { margin: 0 0 0.7rem; color: #5c6469; }
  p:last-child { margin-bottom: 0; }
  .tag {
    display: inline-block;
    background: #eceae4;
    border: 1px solid #dcdcd8;
    padding: 0.1rem 0.45rem;
    font-size: 0.82rem;
  }
</style>
</head>
<body>

<div class="card">
  <h1>siwang-backup</h1>
  <p><span class="tag">internal</span> <span class="tag">no public access</span></p>
  <p>
    Snapshot host for the Siwang document-control migration. Archives are
    written here nightly by the operations tooling and are not served over
    HTTP.
  </p>
  <p>
    Access is via the operations account only. Direct any request for a restore
    to the IT helpdesk.
  </p>
</div>
