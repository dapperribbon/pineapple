; /etc/supervisor/conf.d/siwang.conf
;
; Runtime process manager for the containerised lab. Replaces systemd, which
; the VM build relies on. Three long-running processes, started in dependency
; order via `priority`:
;
;   mariadb   the database the app talks to over 127.0.0.1:3306
;   php-fpm   the siwang-dev pool, listening on the unix socket the vhost names
;   apache2   the three vhosts
;
; The vhost configs point at /run/php/php8.3-fpm-siwang-dev.sock, so Apache and
; PHP-FPM MUST share a namespace -- that is why this is one container and not
; a compose stack of three. Splitting them would mean rewriting the SetHandler
; lines to fcgi://php:9000, which changes the very config the lab teaches.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql
priority=10
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/sbin/php-fpm8.3 --nodaemonize --fpm-config /etc/php/8.3/fpm/php-fpm.conf
priority=20
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:apache2]
; apache2 needs the variables from envvars (APACHE_LOG_DIR, APACHE_RUN_USER,
; ...) which the vhosts reference; apache2ctl normally sources them for us.
command=/bin/bash -c "source /etc/apache2/envvars && exec /usr/sbin/apache2 -DFOREGROUND"
priority=30
autostart=true
autorestart=true
startsecs=3
stopsignal=WINCH
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Lets `docker compose exec siwang supervisorctl status` work.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock
