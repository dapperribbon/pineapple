# Siwang CTF privesc lab -- container stack.
#
#   cd defence/docker
#   docker compose up -d --build
#   docker compose exec siwang /opt/siwang/install/verify.sh
#
# THE BOXES IN THIS STACK ARE DELIBERATELY VULNERABLE. Stage 3 ends in remote
# code execution as www-data by design. Run it on an isolated lab network only,
# and never on a host you care about.
#
# Two services:
#   siwang  -- the LAMP box (Stages 1-3). Everything runs in one container on
#              purpose; see the header of docker/Dockerfile.
#   smtp    -- an internal mail host (Stage 6 pivot). maddy IMAP/SMTP with one
#              seeded mailbox. INTERNAL network only: it is reachable from the
#              siwang box, never published to the host, so students must pivot
#              through the www-data RCE to read it.
#
# The chain deliberately LEAVES the containers at the end: Stage 7-8 (SSH to a
# real user on the HOST, then root via a SUID PATH-hijack) is provisioned on the
# host by install/privesc-host.sh, NOT here. Because no container needs an
# in-container root stage, both are hardened (cap_drop, narrowed mounts, and --
# on the mail box, which has no file-capability binaries -- no-new-privileges +
# a read-only rootfs).

services:
  siwang:
    build:
      # The context is defence/, so the Dockerfile can COPY apache/, site/,
      # db/ and install/. defence/.dockerignore keeps docs/ and exploit/ out.
      context: ..
      dockerfile: docker/Dockerfile
    image: siwang-lab:1.0
    container_name: siwang-lab
    hostname: siwang
    restart: unless-stopped

    networks:
      # edge  = normal bridge: carries the published 80/443 AND the outbound
      #         egress a reverse shell needs.
      # labnet = internal-only: how the box reaches the mail host. No gateway,
      #         so it adds no new outbound/inbound surface.
      - edge
      - labnet

    # Bound to loopback by default so an absent-minded `docker compose up` does
    # not put a knowingly vulnerable box on the LAN. For a classroom, set the
    # lab NIC's address (or 0.0.0.0) first:
    #
    #     SIWANG_BIND=0.0.0.0 docker compose up -d
    #
    # or put SIWANG_BIND=... in defence/docker/.env
    ports:
      - "${SIWANG_BIND:-127.0.0.1}:80:80"
      - "${SIWANG_BIND:-127.0.0.1}:443:443"

    # A fresh /run each start: no stale apache2.pid or dead FPM socket from the
    # build layer. The entrypoint recreates the subdirectories.
    tmpfs:
      - /run:exec,mode=755

    # Drop every capability, then add back only what this LAMP box needs:
    #   CHOWN/FOWNER/DAC_OVERRIDE -- entrypoint's install/chown of runtime dirs
    #   SETUID/SETGID             -- apache/php-fpm/mariadb dropping to their
    #                                unprivileged users
    #   KILL                      -- supervisor signalling those child processes
    #   NET_BIND_SERVICE          -- binding :80 / :443
    #   NET_RAW                   -- the ping diagnostics rabbit hole
    #   SETFCAP                   -- entrypoint re-asserts cap_net_raw on ping
    # NOTE: no `no-new-privileges` here on purpose -- it would make the kernel
    # ignore ping's cap_net_raw file capability and break the diagnostics tool
    # (verify.sh would fail). The mail box, which has no file-cap binaries, does
    # set it. Do NOT add privileged: true.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP

    stop_grace_period: 25s

    # --- Optional: persist the database across `docker compose down` ---------
    # Off by default. Recreating the container is the intended way to reset the
    # lab between cohorts, and a fresh volume triggers the entrypoint's
    # re-provisioning path (new random DB password, re-seeded accounts).
    # volumes:
    #   - siwang-db:/var/lib/mysql

    # --- Real TLS instead of the built-in self-signed cert -------------------
    # Narrowed to the siwang cert ONLY. A broad `/etc/letsencrypt/archive:ro`
    # mount would expose EVERY certificate's private key on the host inside a
    # knowingly-vulnerable container -- so mount just this cert's live symlinks
    # and the one archive subdir they point into. Comment both out to fall back
    # to the image's self-signed cert.
    volumes:
      - /etc/letsencrypt/live/siwang.duckdns.org:/etc/letsencrypt/live/siwang.duckdns.org:ro
      - /etc/letsencrypt/archive/siwang.duckdns.org:/etc/letsencrypt/archive/siwang.duckdns.org:ro

    # --- Optional: edit the app without rebuilding ---------------------------
    # Bind-mounting the docroot defeats lockdown.sh's ownership rules (the
    # mount arrives with the host's uid/gid), so www-data may end up able to
    # write app code -- an unintended path. Use it while developing, never for
    # a box students touch, and re-run lockdown.sh after mounting.
    # volumes:
    #   - ../site/dev:/var/www/dev

  smtp:
    build:
      context: ..
      dockerfile: docker/smtp/Dockerfile
    image: siwang-mail:1.0
    container_name: siwang-mail
    hostname: mail
    restart: unless-stopped

    # INTERNAL network only, and NO `ports:` -- the mail host is never published
    # to the host. The only way to it is from the siwang container (the pivot).
    networks:
      labnet:
        aliases:
          - mail
          - mail.siwang-trading.example

    # A pure read target: no shell user, no sshd, no SUID, no file-cap binaries.
    # So it gets the full hardening treatment.
    read_only: true
    tmpfs:
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # maddy binds 25/143 (both < 1024); nothing else is needed.
      - NET_BIND_SERVICE

    stop_grace_period: 10s

networks:
  edge:
    driver: bridge
  labnet:
    driver: bridge
    internal: true

