# Siwang CTF lab -- trimmed maddy configuration for the internal mail host.
#
# THIS IS A LAB MAIL SERVER. TLS is deliberately OFF and plaintext AUTH is
# allowed: the box lives on an internal-only docker network (labnet) and
# students reach it only after pivoting through the Stage 3 www-data RCE. Do
# NOT publish it outside the lab network.
#
# Everything to do with real internet mail (DKIM/SPF/DMARC, MX lookups, the
# outbound queue) is stripped out -- there is no DNS on the lab network and the
# only mail that matters is pre-seeded locally by seed-mail.sh. What remains is
# just enough to (a) authenticate a user and (b) let them read their inbox over
# IMAP, which is the whole point of Stage 6.

state_dir   /data
runtime_dir /tmp

$(hostname)        = {env:MADDY_HOSTNAME}
$(primary_domain)  = {env:MADDY_DOMAIN}
$(local_domains)   = $(primary_domain)

tls off

# --- Local credentials + mailbox storage (both SQLite under /data) ----------
auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}

hostname $(hostname)

# --- Local delivery only ----------------------------------------------------
msgpipeline local_routing {
    destination $(local_domains) {
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

smtp tcp://0.0.0.0:25 {
    default_source {
        destination $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.1.1 "Relaying denied"
        }
    }
}

# Submission with plaintext AUTH (insecure_auth is required because TLS is off).
submission tcp://0.0.0.0:587 {
    insecure_auth yes
    auth &local_authdb

    default_source {
        destination $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.7.1 "Lab mail host: local delivery only"
        }
    }
}

# IMAP -- how the student reads chrysanta's inbox once they have her password.
imap tcp://0.0.0.0:143 {
    insecure_auth yes
    auth    &local_authdb
    storage &local_mailboxes
}
